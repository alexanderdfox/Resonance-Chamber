<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
	 viewBox="0 -260 1000 1200"
	 width="100%"
	 height="100%"
	 role="img"
	 aria-label="Modern acoustic guitar illustration">

  <defs>
	<!-- Body finish -->
	<radialGradient id="sunburst" cx="50%" cy="42%" r="70%">
	  <stop offset="0%" stop-color="#d69a5c"/>
	  <stop offset="45%" stop-color="#b56b38"/>
	  <stop offset="80%" stop-color="#6b341f"/>
	  <stop offset="100%" stop-color="#2e160f"/>
	</radialGradient>

	<!-- Neck gradient -->
	<linearGradient id="neckWood" x1="0" y1="0" x2="0" y2="1">
	  <stop offset="0%" stop-color="#8a5b36"/>
	  <stop offset="100%" stop-color="#5b3923"/>
	</linearGradient>

	<!-- Metallic strings -->
	<linearGradient id="stringMetal" x1="0" y1="0" x2="1" y2="0">
	  <stop offset="0%" stop-color="#dfe3e6"/>
	  <stop offset="50%" stop-color="#ffffff"/>
	  <stop offset="100%" stop-color="#c4c9cc"/>
	</linearGradient>

	<!-- Soft shadow -->
	<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
	  <feDropShadow dx="0" dy="10" stdDeviation="12"
					flood-color="#000000" flood-opacity="0.25"/>
	</filter>

	<!-- Decorative rosette -->
	<radialGradient id="rosetteGold" cx="50%" cy="50%" r="50%">
	  <stop offset="0%" stop-color="#f6d28a"/>
	  <stop offset="100%" stop-color="#9a6a22"/>
	</radialGradient>
  </defs>

  <!-- Guitar Group -->
  <g filter="url(#shadow)">

	<!-- Neck -->
	<rect x="425" y="-180" width="50" height="250"
		  rx="10"
		  fill="url(#neckWood)"
		  stroke="#3a2416"
		  stroke-width="3"/>

	<!-- Fretboard -->
	<rect x="417" y="-180" width="66" height="250"
		  rx="8"
		  fill="#1f1b1a"
		  stroke="#0f0d0d"
		  stroke-width="2"/>

	<!-- Frets -->
	<g stroke="#cfd3d6" stroke-width="2">
	  <line x1="420" y1="-150" x2="480" y2="-150"/>
	  <line x1="420" y1="-125" x2="480" y2="-125"/>
	  <line x1="420" y1="-100" x2="480" y2="-100"/>
	  <line x1="420" y1="-75"  x2="480" y2="-75"/>
	  <line x1="420" y1="-50"  x2="480" y2="-50"/>
	  <line x1="420" y1="-25"  x2="480" y2="-25"/>
	  <line x1="420" y1="0"    x2="480" y2="0"/>
	  <line x1="420" y1="25"   x2="480" y2="25"/>
	  <line x1="420" y1="50"   x2="480" y2="50"/>
	</g>

	<!-- Fret markers -->
	<g fill="#d8d8d8">
	  <circle cx="450" cy="-112" r="4"/>
	  <circle cx="450" cy="-62" r="4"/>
	  <circle cx="450" cy="-12" r="4"/>
	  <circle cx="438" cy="38" r="4"/>
	  <circle cx="462" cy="38" r="4"/>
	</g>

	<!-- Headstock -->
	<path d="M405 -250
			 L495 -250
			 C505 -250 510 -240 508 -228
			 L500 -180
			 L400 -180
			 L392 -228
			 C390 -240 395 -250 405 -250 Z"
		  fill="#5d3723"
		  stroke="#2a1810"
		  stroke-width="3"/>

	<!-- Tuning pegs -->
	<g fill="#d7dadd" stroke="#80868c" stroke-width="1.5">
	  <!-- Left -->
	  <rect x="368" y="-238" width="26" height="8" rx="3"/>
	  <circle cx="394" cy="-234" r="5"/>

	  <rect x="364" y="-218" width="30" height="8" rx="3"/>
	  <circle cx="394" cy="-214" r="5"/>

	  <rect x="368" y="-198" width="26" height="8" rx="3"/>
	  <circle cx="394" cy="-194" r="5"/>

	  <!-- Right -->
	  <rect x="506" y="-238" width="26" height="8" rx="3"/>
	  <circle cx="506" cy="-234" r="5"/>

	  <rect x="506" y="-218" width="30" height="8" rx="3"/>
	  <circle cx="506" cy="-214" r="5"/>

	  <rect x="506" y="-198" width="26" height="8" rx="3"/>
	  <circle cx="506" cy="-194" r="5"/>
	</g>

	<!-- Body -->
	<path
	  d="M 464.253 42.389 C 520.195 46.807 570.579 78.448 598.716 127.264 C 628.597 179.106 629.034 242.795 600.288 295.275 C 589.068 315.759 583.123 338.75 583.096 362.105 C 583.068 385.25 588.902 408.028 600.006 428.335 C 623.791 471.834 669.073 499.267 718.64 500.312 C 778.464 501.574 833.409 533.831 863.356 585.634 C 910.57 667.307 882.545 771.822 800.835 818.971 C 720.239 865.478 617.256 838.863 569.11 759.235 C 543.462 716.816 497.083 691.299 447.525 692.44 C 424.387 692.972 401.755 699.332 381.714 710.909 C 361.481 722.596 344.495 739.2 332.38 759.18 C 301.356 810.347 245.983 841.825 186.145 841.858 C 91.808 841.91 15.31 765.382 15.332 671.044 C 15.353 577.989 89.897 502.111 182.932 500.232 C 232.49 499.231 318.483 385.25 318.478 362.105 C 318.473 338.739 312.562 315.741 301.286 295.276 C 256.377 213.775 284.808 111.297 365.379 64.741 C 385.574 53.072 407.86 45.724 430.832 43.025 Z"
	  fill="url(#sunburst)"
	  stroke="#2b140c"
	  stroke-width="8"
	  stroke-linejoin="round"/>

	<!-- Soundhole -->
	<circle cx="450" cy="205" r="78"
			fill="#111"/>

	<!-- Rosette -->
	<circle cx="450" cy="205" r="92"
			fill="none"
			stroke="url(#rosetteGold)"
			stroke-width="8"/>

	<circle cx="450" cy="205" r="84"
			fill="none"
			stroke="#f3d89b"
			stroke-width="2"/>

	<circle cx="450" cy="205" r="98"
			fill="none"
			stroke="#5a2e18"
			stroke-width="2"/>

	<!-- Bridge -->
	<g>
	  <rect x="390" y="560" width="120" height="34"
			rx="8"
			fill="#2d1d15"
			stroke="#130c09"
			stroke-width="2"/>

	  <rect x="405" y="548" width="90" height="10"
			rx="3"
			fill="#efe8d6"/>

	  <!-- Bridge pins -->
	  <g fill="#f1ead7">
		<circle cx="415" cy="575" r="4"/>
		<circle cx="431" cy="575" r="4"/>
		<circle cx="447" cy="575" r="4"/>
		<circle cx="463" cy="575" r="4"/>
		<circle cx="479" cy="575" r="4"/>
		<circle cx="495" cy="575" r="4"/>
	  </g>
	</g>

	<!-- Strings -->
	<g stroke="url(#stringMetal)"
	   stroke-linecap="round"
	   fill="none">
	  <line x1="418" y1="-235" x2="415" y2="553" stroke-width="1.2"/>
	  <line x1="430" y1="-235" x2="431" y2="553" stroke-width="1.1"/>
	  <line x1="442" y1="-235" x2="447" y2="553" stroke-width="1"/>
	  <line x1="458" y1="-235" x2="463" y2="553" stroke-width="1"/>
	  <line x1="470" y1="-235" x2="479" y2="553" stroke-width="1.1"/>
	  <line x1="482" y1="-235" x2="495" y2="553" stroke-width="1.2"/>
	</g>

  
	  <ellipse cx="190.0" cy="655.0" rx="75" ry="75" transform="rotate(-15 200 620)" fill="#1a1a1a" stroke="#222222" stroke-width="3"/>
	
	  <ellipse cx="680.9" cy="655.0" rx="75" ry="75" transform="rotate(15 670.9 620)" fill="#1a1a1a" stroke="#222222" stroke-width="3"/>

  </g>
</svg>