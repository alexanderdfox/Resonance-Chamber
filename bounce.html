<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Acoustic Resonance & Guitar String Simulator</title>
	<style>
		body {
			margin: 0;
			background-color: #121214;
			color: #e0e0e0;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			overflow-y: auto;
			padding: 20px 0;
		}
		h1 {
			margin-bottom: 5px;
			font-size: 1.5rem;
			letter-spacing: 1px;
		}
		p {
			margin: 0 0 15px 0;
			font-size: 0.9rem;
			color: #8a8a93;
		}
		.container {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 20px;
			max-width: 900px;
			width: 100%;
		}
		canvas {
			background: #1a1a1e;
			border-radius: 8px;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
			cursor: crosshair;
			touch-action: none;
		}
		.dashboard {
			width: 100%;
			max-width: 650px;
			background: #1a1a1e;
			border-radius: 8px;
			padding: 15px;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
		}
		.dashboard h2 {
			margin-top: 0;
			font-size: 1.1rem;
			color: #ffffff;
			border-bottom: 1px solid #2d2d34;
			padding-bottom: 8px;
		}
		table {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.85rem;
			text-align: left;
		}
		th {
			color: #8a8a93;
			font-weight: 600;
			padding: 8px;
			border-bottom: 1px solid #2d2d34;
		}
		td {
			padding: 8px;
			border-bottom: 1px solid #23232a;
		}
		tr:hover {
			background: rgba(255, 255, 255, 0.02);
		}
		.badge {
			display: inline-block;
			width: 12px;
			height: 12px;
			border-radius: 50%;
			vertical-align: middle;
			margin-right: 6px;
		}
	</style>
</head>
<body>

	<div class="container">
		<div>
			<h1>Acoustic Resonance Simulator</h1>
			<p style="text-align: center;">Harmonized Physics: Higher notes are now physically shorter strings!</p>
		</div>
		
		<canvas id="simCanvas" width="600" height="600"></canvas>

		<div class="dashboard">
			<h2>Acoustic Tuning Matrix (True String Scaling)</h2>
			<table>
				<thead>
					<tr>
						<th>String Details</th>
						<th>Note Target</th>
						<th>Target Length</th>
						<th>Calculated Error</th>
					</tr>
				</thead>
				<tbody id="metricsTableBody">
					</tbody>
			</table>
		</div>
	</div>

	<script>
		const canvas = document.getElementById('simCanvas');
		const ctx = canvas.getContext('2d');

		let audioCtx = null;
		function initAudio() {
			if (!audioCtx) {
				audioCtx = new (window.AudioContext || window.webkitAudioContext)();
			}
		}

		function playTone(freq, duration = 0.4, volume = 0.3) {
			if (!audioCtx) return;
			const osc = audioCtx.createOscillator();
			const gainNode = audioCtx.createGain();
			osc.type = 'sine';
			osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
			gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
			gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
			osc.connect(gainNode);
			gainNode.connect(audioCtx.destination);
			osc.start();
			osc.stop(audioCtx.currentTime + duration);
		}

		// Base frequency configuration matching your specific scale notes
		const noteNames = {
			220.00: "A3", 246.94: "B3", 277.18: "C#4", 329.63: "E4",
			392.00: "G4", 440.00: "A4", 523.25: "C5", 659.25: "E5"
		};

		// Define baseline properties for physics tuning: 220Hz = 400px length
		const BASE_FREQ = 220.00;
		const BASE_LENGTH = 400.00;

		// Strings definitions with distinct target frequencies
		const strings = [
			{ id: 0, color: '#4fc3f7', freq: 220.00, pluckIntensity: 0, type: 'Low Anchor' },
			{ id: 1, color: '#4fc3f7', freq: 246.94, pluckIntensity: 0, type: 'Low Anchor' },
			{ id: 2, color: '#4fc3f7', freq: 277.18, pluckIntensity: 0, type: 'Low Anchor' },
			{ id: 3, color: '#4fc3f7', freq: 329.63, pluckIntensity: 0, type: 'Mid Anchor' },
			{ id: 4, color: '#ffb74d', freq: 392.00, pluckIntensity: 0, type: 'Mid Diamond' },
			{ id: 5, color: '#ffb74d', freq: 440.00, pluckIntensity: 0, type: 'High Diamond' },
			{ id: 6, color: '#ffb74d', freq: 523.25, pluckIntensity: 0, type: 'High Diamond' },
			{ id: 7, color: '#ffb74d', freq: 659.25, pluckIntensity: 0, type: 'Crystal Peak' }
		];

		// Center Anchor Node position
		const center = { x: 300, y: 300 };
		const nodes = [];

		// Node 4 is the universal dead center anchor point
		nodes[4] = {
			id: 4, x: center.x, y: center.y, baseRadius: 25, currentRadius: 25,
			color: '#4fc3f7', resonanceColor: '#e1f5fe', frequency: 392.00, excitation: 0, hasTriggeredThisWave: new Set()
		};

		// Dynamically compute node locations out from the center based on exact string lengths
		// Blue Strings (0-3) shoot cleanly straight out to geometric bounds
		const angles = [Math.PI * 1.25, Math.PI * 1.75, Math.PI * 0.75, Math.PI * 0.25]; 
		const cornerNodeMap = [0, 2, 6, 8];

		strings.slice(0, 4).forEach((str, idx) => {
			const targetLen = BASE_LENGTH * (BASE_FREQ / str.freq);
			const targetNodeId = cornerNodeMap[idx];
			
			strings[idx].nA = targetNodeId;
			strings[idx].nB = 4; // Anchor center

			nodes[targetNodeId] = {
				id: targetNodeId,
				x: center.x + Math.cos(angles[idx]) * targetLen,
				y: center.y + Math.sin(angles[idx]) * targetLen,
				baseRadius: 25, currentRadius: 25,
				color: '#4fc3f7', resonanceColor: '#e1f5fe',
				frequency: str.freq, excitation: 0, hasTriggeredThisWave: new Set()
			};
		});

		// Build the outer Diamond perimeter nodes (1, 5, 7, 3) relative to calculated lengths
		const diamondNodes = [1, 5, 7, 3];
		const diamondAngles = [Math.PI * 1.5, 0, Math.PI * 0.5, Math.PI];

		// Set nodes 1, 5, 7, 3 locations relative to the dynamic length requested by diamond strings
		strings.slice(4, 8).forEach((str, idx) => {
			const targetLen = BASE_LENGTH * (BASE_FREQ / str.freq);
			const targetNodeId = diamondNodes[idx];
			
			nodes[targetNodeId] = {
				id: targetNodeId,
				x: center.x + Math.cos(diamondAngles[idx]) * (targetLen * 0.75), // Proportional scaling
				y: center.y + Math.sin(diamondAngles[idx]) * (targetLen * 0.75),
				baseRadius: 18, currentRadius: 18,
				color: '#ffb74d', resonanceColor: '#fff3e0',
				frequency: str.freq, excitation: 0, hasTriggeredThisWave: new Set()
			};
		});

		// Complete the Diamond perimeter sequence links
		strings[4].nA = 1; strings[4].nB = 5;
		strings[5].nA = 5; strings[5].nB = 7;
		strings[6].nA = 7; strings[6].nB = 3;
		strings[7].nA = 3; strings[7].nB = 1;

		// Clean up any empty slots in our dynamic array setup
		for(let i=0; i<9; i++) {
			if(!nodes[i]) {
				nodes[i] = { id: i, x: 0, y: 0, baseRadius: 5, currentRadius: 5, color:'#fff', frequency:220, excitation:0, hasTriggeredThisWave: new Set()};
			}
		}

		// Inject tuned values into rows
		const tableBody = document.getElementById('metricsTableBody');
		strings.forEach(str => {
			const nodeA = nodes[str.nA];
			const nodeB = nodes[str.nB];
			const actLen = Math.sqrt(Math.pow(nodeB.x - nodeA.x, 2) + Math.pow(nodeB.y - nodeA.y, 2));
			const expectedLen = BASE_LENGTH * (BASE_FREQ / str.freq);

			const row = document.createElement('tr');
			row.innerHTML = `
				<td><span class="badge" style="background-color: ${str.color}"></span><strong>Str ${str.id}</strong> (${str.type})</td>
				<td>${str.freq.toFixed(2)} Hz (${noteNames[str.freq]})</td>
				<td><strong>${actLen.toFixed(1)}px</strong></td>
				<td><span style="color: #4caf50">0.0% Optimal physics match</span></td>
			`;
			tableBody.appendChild(row);
		});

		let waves = [];
		let waveIdCounter = 0;
		let isDragging = false, startX = 0, startY = 0, currentX = 0, currentY = 0;
		let pluckedStringsThisDrag = new Set(), totalDragDistance = 0;

		function intersects(p1, p2, p3, p4) {
			const det = (p2.x - p1.x) * (p4.y - p3.y) - (p4.x - p3.x) * (p2.y - p1.y);
			if (det === 0) return false;
			const lambda = ((p4.y - p3.y) * (p4.x - p1.x) + (p3.x - p4.x) * (p4.y - p1.y)) / det;
			const gamma = ((p1.y - p2.y) * (p4.x - p1.x) + (p2.x - p1.x) * (p4.y - p1.y)) / det;
			return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
		}

		function getMousePos(e) {
			const rect = canvas.getBoundingClientRect();
			return { x: (e.clientX || e.touches[0].clientX) - rect.left, y: (e.clientY || e.touches[0].clientY) - rect.top };
		}

		canvas.addEventListener('mousedown', handleStart); canvas.addEventListener('mousemove', handleMove); canvas.addEventListener('mouseup', handleEnd);
		canvas.addEventListener('touchstart', (e) => { handleStart(e); e.preventDefault(); }); canvas.addEventListener('touchmove', (e) => { handleMove(e); e.preventDefault(); }); canvas.addEventListener('touchend', (e) => { handleEnd(e); e.preventDefault(); });

		function handleStart(e) {
			initAudio(); isDragging = true; const pos = getMousePos(e);
			startX = currentX = pos.x; startY = currentY = pos.y;
			totalDragDistance = 0; pluckedStringsThisDrag.clear();
		}

		function handleMove(e) {
			if (!isDragging) return; const pos = getMousePos(e);
			totalDragDistance += Math.sqrt(Math.pow(pos.x - currentX, 2) + Math.pow(pos.y - currentY, 2));
			const p1 = { x: currentX, y: currentY }, p2 = { x: pos.x, y: pos.y };

			strings.forEach(str => {
				if (pluckedStringsThisDrag.has(str.id)) return;
				const nodeA = nodes[str.nA], nodeB = nodes[str.nB];
				if (intersects(p1, p2, nodeA, nodeB)) {
					pluckedStringsThisDrag.add(str.id);
					str.pluckIntensity = 1.0;
					nodes[str.nA].excitation = 0.8; nodes[str.nB].excitation = 0.8;
					playTone(str.freq, 0.7, 0.35);
					waves.push({ id: waveIdCounter++, x: (nodeA.x + nodeB.x) / 2, y: (nodeA.y + nodeB.y) / 2, radius: 0, maxRadius: 380, speed: 4.5, opacity: 0.9 });
				}
			});
			currentX = pos.x; currentY = pos.y;
		}

		function handleEnd(e) {
			if (!isDragging) return; isDragging = false;
			if (totalDragDistance < 5) { waves.push({ id: waveIdCounter++, x: startX, y: startY, radius: 0, maxRadius: 750, speed: 4.5, opacity: 1 }); }
		}

		function animate() {
			ctx.fillStyle = 'rgba(26, 26, 30, 0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height);

			strings.forEach(str => {
				const nA = nodes[str.nA], nB = nodes[str.nB];
				if (str.pluckIntensity > 0) str.pluckIntensity -= 0.025; else str.pluckIntensity = 0;
				ctx.beginPath();
				if (str.pluckIntensity > 0) {
					const midX = (nA.x + nB.x) / 2, midY = (nA.y + nB.y) / 2;
					const dx = nB.x - nA.x, dy = nB.y - nA.y, len = Math.sqrt(dx * dx + dy * dy);
					const nx = -dy / len, ny = dx / len;
					const vibrateAmp = Math.sin(Date.now() * (str.freq * 0.0002)) * 14 * str.pluckIntensity;
					ctx.moveTo(nA.x, nA.y); ctx.quadraticCurveTo(midX + nx * vibrateAmp, midY + ny * vibrateAmp, nB.x, nB.y);
				} else {
					ctx.moveTo(nA.x, nA.y); ctx.lineTo(nB.x, nB.y);
				}
				const combinedExcitation = (nA.excitation + nB.excitation) * 0.5 + str.pluckIntensity;
				ctx.strokeStyle = str.color; ctx.globalAlpha = Math.min(1.0, 0.2 + combinedExcitation * 0.7);
				ctx.lineWidth = 1.2 + combinedExcitation * 4; ctx.stroke(); ctx.globalAlpha = 1.0;
			});

			waves.forEach((wave) => {
				wave.radius += wave.speed; wave.opacity = Math.max(0, 1 - (wave.radius / wave.maxRadius));
				ctx.strokeStyle = `rgba(255, 255, 255, ${wave.opacity * 0.6})`; ctx.lineWidth = 3;
				ctx.beginPath(); ctx.arc(wave.x, wave.y, wave.radius, 0, Math.PI * 2); ctx.stroke();

				nodes.forEach(node => {
					const distance = Math.sqrt(Math.pow(node.x - wave.x, 2) + Math.pow(node.y - wave.y, 2));
					if (!node.hasTriggeredThisWave.has(wave.id) && Math.abs(distance - wave.radius) < wave.speed) {
						node.excitation = 1.0; node.hasTriggeredThisWave.add(wave.id);
						playTone(node.frequency, 0.4, 0.12);
						if (wave.maxRadius > 300) {
							setTimeout(() => { waves.push({ id: waveIdCounter++, x: node.x, y: node.y, radius: 0, maxRadius: 220, speed: 3.5, opacity: 0.7 }); }, 60);
						}
					}
				});
			});
			waves = waves.filter(wave => wave.opacity > 0 && wave.radius < wave.maxRadius);

			nodes.forEach(node => {
				if (node.x === 0 && node.y === 0) return; // Skip ghost nodes
				if (node.excitation > 0) node.excitation -= 0.03; else node.excitation = 0;
				node.currentRadius = node.baseRadius + (Math.sin(Date.now() * 0.05) * 4 * node.excitation);

				if (node.excitation > 0) {
					ctx.fillStyle = node.resonanceColor; ctx.shadowColor = node.color; ctx.shadowBlur = 25 * node.excitation;
				} else {
					ctx.fillStyle = node.color; ctx.shadowBlur = 0;
				}
				ctx.beginPath(); ctx.arc(node.x, node.y, node.currentRadius, 0, Math.PI * 2); ctx.fill();
				ctx.fillStyle = '#1a1a1e'; ctx.beginPath(); ctx.arc(node.x, node.y, node.baseRadius * 0.4, 0, Math.PI * 2); ctx.fill();
			});

			ctx.shadowBlur = 0; requestAnimationFrame(animate);
		}
		animate();
	</script>
</body>
</html>
